[project]
name = "leakagent"
version = "0.1.0"
description = "Repository-grounded investigation of LeakScope Android lifecycle-retention candidates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leakagent = "leakagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leakagent"]

